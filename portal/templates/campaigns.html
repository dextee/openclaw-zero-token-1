{% extends "base.html" %}
{% block title %}Campaigns — SG Pipeline{% endblock %}
{% block content %}
<h1 class="text-2xl font-bold text-zinc-100 mb-6">Campaigns</h1>

<div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
  {% for c in campaigns %}
  <div class="bg-zinc-900 border border-zinc-800 rounded-xl p-5 hover:border-zinc-700 transition-colors">
    <div class="flex items-center justify-between mb-3">
      <span class="inline-flex px-2 py-0.5 rounded text-xs font-medium border status-{{ c.status }}">{{ c.status }}</span>
      <span class="text-zinc-600 text-xs">{{ c.created.isoformat()[:10] }}</span>
    </div>
    <h3 class="text-zinc-100 font-medium text-base mb-1">
      <a href="/portal/campaigns/{{ c.file_id }}" class="hover:text-amber-400 transition-colors">{{ c.name }}</a>
    </h3>
  </div>
  {% else %}
  <div class="col-span-full text-zinc-500 text-center py-12">No campaigns found.</div>
  {% endfor %}
</div>
{% endblock %}
